# Docker Compose para producción usando imágenes desde Docker Hub
# Uso: docker compose -f docker-compose.prod.yml up -d
# Las imágenes se descargan automáticamente desde Docker Hub

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlplatform}
      POSTGRES_USER: ${POSTGRES_USER:-mluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mluser} -d ${POSTGRES_DB:-mlplatform}"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-store:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  object-store-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      object-store:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://object-store:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb -p local/mlflow || true;
      mc mb -p local/eva-artifacts || true;
      exit 0;
      "

  mlflow:
    image: ${DOCKER_HUB_USER:-diegovasquez600}/eva-mlflow:latest
    depends_on:
      db:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    restart: always
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://object-store:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-mluser}:${POSTGRES_PASSWORD:-mlpass}@db:5432/${POSTGRES_DB:-mlplatform}
      --default-artifact-root s3://mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000').read()"]
      interval: 10s
      timeout: 5s
      retries: 20

  trainer:
    image: ${DOCKER_HUB_USER:-diegovasquez600}/eva-trainer:latest
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      EVA_MAX_ROWS: ${EVA_MAX_ROWS:-12000}
      EVA_MLFLOW_TRACKING_URI: ${EVA_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      EVA_MLFLOW_EXPERIMENT_NAME: ${EVA_MLFLOW_EXPERIMENT_NAME:-eva_proxy_safe}
      MLFLOW_S3_ENDPOINT_URL: http://object-store:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./artifacts/models:/app/artifacts/models
      - ./data:/app/data:ro

  api:
    image: ${DOCKER_HUB_USER:-diegovasquez600}/eva-api:latest
    depends_on:
      trainer:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: always
    environment:
      EVA_MODELS_DIR: /app/artifacts/models
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-mlplatform}
      DB_USER: ${POSTGRES_USER:-mluser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mlpass}
    volumes:
      - ./artifacts/models:/app/artifacts/models
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: ${DOCKER_HUB_USER:-diegovasquez600}/eva-frontend:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  minio_data:
